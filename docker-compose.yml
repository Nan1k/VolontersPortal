# Запуск: docker compose up --build
# UI: http://109.172.37.85:3080  API: http://109.172.37.85:8080  docs: http://109.172.37.85:8080/docs
# БД доступна только внутри Docker-сети (порт наружу не пробрасывается).
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-volonters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volonters}
      POSTGRES_DB: ${POSTGRES_DB:-volonters}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-volonters} -d ${POSTGRES_DB:-volonters}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-volonters}
      DB_USER: ${POSTGRES_USER:-volonters}
      DB_PASS: ${POSTGRES_PASSWORD:-volonters}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://109.172.37.85:3080}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${PUBLIC_API_URL:-http://109.172.37.85:8080}
    ports:
      - "3080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
